name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        env:
          LLM_PROVIDER: auto
          GEMINI_API_KEY: ci-test-key
          GROQ_API_KEY: ci-test-key
          TAVILY_API_KEY: ci-test-key
        run: python -m pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  prepare-deployments:
    name: Check deployment configuration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    outputs:
      render_enabled: ${{ steps.check.outputs.render_enabled }}
      vercel_enabled: ${{ steps.check.outputs.vercel_enabled }}
    steps:
      - name: Check deployment credentials
        id: check
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "render_enabled=true" >> "$GITHUB_OUTPUT"
            echo "- Render: deployment enabled." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "render_enabled=false" >> "$GITHUB_OUTPUT"
            echo "- Render: deployment skipped; configure the \`RENDER_DEPLOY_HOOK_URL\` repository secret." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "vercel_enabled=true" >> "$GITHUB_OUTPUT"
            echo "- Vercel: deployment enabled." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "vercel_enabled=false" >> "$GITHUB_OUTPUT"
            echo "- Vercel: deployment skipped; configure \`VERCEL_TOKEN\`, \`VERCEL_ORG_ID\`, and \`VERCEL_PROJECT_ID\` repository secrets." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-render:
    name: Deploy backend to Render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare-deployments.outputs.render_enabled == 'true'
    needs: [backend, frontend, prepare-deployments]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            --request POST "$RENDER_DEPLOY_HOOK_URL"

  deploy-vercel:
    name: Deploy frontend to Vercel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare-deployments.outputs.vercel_enabled == 'true'
    needs: [backend, frontend, prepare-deployments]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@41 link --yes \
            --project "$VERCEL_PROJECT_ID" \
            --scope "$VERCEL_ORG_ID" \
            --token "$VERCEL_TOKEN"

      - name: Pull production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          npx vercel@41 pull --yes \
            --environment=production \
            --scope "$VERCEL_ORG_ID" \
            --token "$VERCEL_TOKEN"

      - name: Build and deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel@41 build --prod --token "$VERCEL_TOKEN"
          npx vercel@41 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
